name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --legacy-peer-deps --no-package-lock
      - run: npm run lint
      - run: npm test
        env:
          QCC_REQUIRE_HOST_DEPS: '1'
      - run: npm run verify-pack
